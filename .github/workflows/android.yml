
name: Exam Rescue Android CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f gradle/wrapper/gradle-wrapper.properties ]]; then
            DIST_URL="$(sed -n 's/^distributionUrl=//p' gradle/wrapper/gradle-wrapper.properties | sed 's/\\:/:/g')"
            if [[ -z "$DIST_URL" ]]; then
              echo "::error::Cannot read Gradle distribution URL"
              exit 1
            fi
            ZIP_NAME="${DIST_URL##*/}"
            GRADLE_VERSION="${ZIP_NAME#gradle-}"
            GRADLE_VERSION="${GRADLE_VERSION%-bin.zip}"
          else
            GRADLE_VERSION="9.3.1"
            ZIP_NAME="gradle-${GRADLE_VERSION}-bin.zip"
            DIST_URL="https://services.gradle.org/distributions/${ZIP_NAME}"
          fi

          ZIP_PATH="$RUNNER_TEMP/$ZIP_NAME"

          curl --fail --location --retry 3 \
            "$DIST_URL" --output "$ZIP_PATH"

          unzip -q "$ZIP_PATH" -d "$RUNNER_TEMP"

          GRADLE_HOME="$RUNNER_TEMP/gradle-${GRADLE_VERSION}"

          if [[ ! -x "$GRADLE_HOME/bin/gradle" ]]; then
            echo "::error::Gradle executable not found"
            exit 1
          fi

          echo "$GRADLE_HOME/bin" >> "$GITHUB_PATH"
          "$GRADLE_HOME/bin/gradle" --version

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts || test -f settings.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle
          echo "Android project files found."

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: exam-rescue-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
