name: Android APK Build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      JAVA_VERSION: "17"
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK command line tools
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$ANDROID_SDK_ROOT"
          if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" ]; then
            wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O /tmp/cmdline-tools.zip
            rm -rf "$ANDROID_SDK_ROOT/cmdline-tools"
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT"
            if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/bin" ]; then
              mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
              mv "$ANDROID_SDK_ROOT/cmdline-tools/bin" "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
              mv "$ANDROID_SDK_ROOT/cmdline-tools/lib" "$ANDROID_SDK_ROOT/cmdline-tools/latest/lib" 2>/dev/null || true
              mv "$ANDROID_SDK_ROOT/cmdline-tools/source.properties" "$ANDROID_SDK_ROOT/cmdline-tools/latest/source.properties" 2>/dev/null || true
              mv "$ANDROID_SDK_ROOT/cmdline-tools/NOTICE.txt" "$ANDROID_SDK_ROOT/cmdline-tools/latest/NOTICE.txt" 2>/dev/null || true
            fi
          fi

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmdline-tools;latest"

      - name: Create debug keystore
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f "${{ github.workspace }}/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "${{ github.workspace }}/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Ensure Gradle wrapper exists
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f "./gradlew" ]; then
            echo "No gradlew found. Generating wrapper..."
            wget -q "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip" -O /tmp/gradle-9.3.1-bin.zip
            unzip -q /tmp/gradle-9.3.1-bin.zip -d /tmp
            /tmp/gradle-9.3.1/bin/gradle wrapper --no-daemon --stacktrace
          fi

      - name: Verify required project files
        shell: bash
        run: |
          set -euxo pipefail
          test -f settings.gradle.kts || test -f settings.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle
          echo "Project files OK"

      - name: Run unit tests
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: exam-rescue-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
