name: Android APK Build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # IMPORTANT: the GitHub runner already ships the Android SDK at
      # /usr/local/lib/android/sdk with both ANDROID_HOME and ANDROID_SDK_ROOT
      # pointing there. AGP 9 fails the build with "Several environment
      # variables and/or system properties contain different paths to the SDK"
      # if ANDROID_SDK_ROOT is overridden to a custom location, so we reuse the
      # preinstalled SDK and never override the environment variables.
      - name: Accept Android SDK licenses and install components
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          # Accept licenses; the broken pipe from `yes` is expected.
          set +o pipefail
          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null || true
          set -o pipefail

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # The debug build type is wired to ${rootDir}/debug.keystore
      # (see app/build.gradle.kts -> signingConfigs.debugConfig),
      # so the keystore must exist before Gradle configures the build.
      - name: Create debug keystore
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "${{ github.workspace }}/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "${{ github.workspace }}/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      # The repository has no committed Gradle wrapper, so generate it with the
      # Gradle version installed on the runner (matches the 9.3.1 version pinned
      # in gradle/wrapper/gradle-wrapper.properties).
      - name: Ensure Gradle wrapper exists
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "./gradlew" ]; then
            echo "No gradlew found. Generating wrapper with the runner's Gradle..."
            gradle wrapper --no-daemon --stacktrace
          fi
          chmod +x ./gradlew

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      # Lint is deliberately NOT part of this job: lintDebug currently reports
      # 4 errors (NewApi warnings in KeystoreManager.kt) which are unrelated to
      # APK assembly. assembleDebug never runs lint.
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: exam-rescue-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
