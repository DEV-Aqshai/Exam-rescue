name: Android APK Build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Ensure Gradle wrapper exists
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f "./gradlew" ]; then
            echo "No gradlew found. Generating wrapper..."
            wget -q "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip" -O /tmp/gradle-9.3.1-bin.zip
            unzip -q /tmp/gradle-9.3.1-bin.zip -d /tmp
            /tmp/gradle-9.3.1/bin/gradle wrapper --no-daemon --stacktrace
          fi

      - name: Verify required project files
        shell: bash
        run: |
          set -euxo pipefail
          test -f settings.gradle.kts || test -f settings.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle
          echo "Project files OK"

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: exam-rescue-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
